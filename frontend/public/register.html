<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Quick Bites</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- HEADER -->
    <header>
        <nav class="navbar flex between wrapper">
            <a href="index.html" class="logo">Quick Bites</a>
        </nav>
    </header>

    <!-- SIGN UP SECTION -->
    <main>
        <section class="auth-section flex">
            <div class="auth-card">
                <h2>Create your account</h2>
                <p class="para auth-subtitle">Sign up to start ordering with Quick Bites.</p>

                <form id="signup-form" class="auth-form">
                    <div class="form-group">
                        <label for="name">Full name</label>
                        <input type="text" id="name" name="name" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
                            <a href="#" class="toggle-password" id="toggle-password">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required minlength="6">
                            <a href="#" class="toggle-password" id="toggle-confirm-password">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                        </div>
                    </div>

                    <p class="error-message" id="error-message"></p>

                    <button type="submit" class="btn auth-btn">Sign Up</button>
                </form>

                <p class="auth-footer">
                    Already have an account? <a href="login.html" class="auth-link">Sign in</a>
                </p>
            </div>
        </section>
    </main>

    <script src="register.js"></script>
</body>

</html>
