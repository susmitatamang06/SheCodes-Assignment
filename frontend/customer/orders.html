<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders - Quick Bites</title>


    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer">


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="../public/style.css"
    >


    <!-- Orders CSS -->
    <link
        rel="stylesheet"
        href="orders.css"
    >

</head>


<body>


    <!-- ========================================
         HEADER
    ========================================= -->

    <header>

        <nav class="navbar flex between wrapper">


            <!-- LOGO -->

            <a href="index.html"
               class="logo">

                Quick Bites

            </a>


            <!-- NAVIGATION -->

            <ul class="navlist flex gap-3">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="index.html#menu">
                        Menu
                    </a>
                </li>

                <li>
                    <a href="index.html#service">
                        Service
                    </a>
                </li>

                <li>
                    <a href="index.html#about">
                        About Us
                    </a>
                </li>

                <li>
                    <a href="index.html#contact">
                        Contacts
                    </a>
                </li>

            </ul>


            <!-- DESKTOP ACTION -->

            <div class="desktop-action flex gap-2">


                <!-- Cart -->

                <a href="index.html"
                   class="cart-icon">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span class="cart-value">
                        0
                    </span>

                </a>


                <!-- Profile -->

                <a href="profile.html"
                   class="customer-profile">

                    <i class="fa-slab-press fa-regular fa-circle-user"></i>

                </a>


                <!-- Hamburger -->

                <a href="#"
                   class="hamburger">

                    <i class="fa-solid fa-bars"></i>

                </a>

            </div>


            <!-- MOBILE MENU -->

            <ul class="mobile-menu">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="index.html#menu">
                        Menu
                    </a>
                </li>

                <li>
                    <a href="index.html#service">
                        Service
                    </a>
                </li>

                <li>
                    <a href="index.html#about">
                        About Us
                    </a>
                </li>

                <li>
                    <a href="index.html#contact">
                        Contacts
                    </a>
                </li>

                <li>
                    <a href="profile.html">
                        Profile
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- ========================================
         MY ORDERS
    ========================================= -->

    <main>

        <section class="orders-section">

            <div class="orders-container">


                <h1>
                    My Orders
                </h1>


                <p class="orders-subtitle">
                    View your previous and current orders
                </p>


                <!-- ========================================
                     DYNAMIC ORDERS
                ========================================= -->

                <div id="orders-list">

                    <!-- Orders will be added here by orders.js -->

                </div>


            </div>

        </section>

    </main>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script defer src="common.js"></script>
    <script defer src="orders.js"></script>

</body>

</html>
