<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile - Quick Bites</title>


    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer">


    <link
        rel="stylesheet"
        href="../public/style.css">


    <link
        rel="stylesheet"
        href="profile.css">


    <script defer src="common.js"></script>
    <script defer src="profile.js"></script>

</head>


<body>


    <!-- HEADER -->

    <header>

        <nav
            class="navbar flex between wrapper">


            <a
                href="index.html"
                class="logo">

                Quick Bites

            </a>


            <div
                class="profile-nav flex gap-2">


                <!-- HOME -->

                <a
                    href="index.html"
                    class="profile-home">

                    <i
                        class="fa-solid fa-house">
                    </i>

                    Home

                </a>


                <!-- LOGOUT -->

                <a
                    href="#"
                    class="btn"
                    id="logout-btn">

                    Logout

                    <i
                        class="fa-solid fa-right-from-bracket">
                    </i>

                </a>


            </div>

        </nav>

    </header>


    <!-- PROFILE SECTION -->

    <main>

        <section
            class="profile-section">


            <div
                class="profile-card">


                <!-- PROFILE IMAGE -->

                <div
                    class="profile-image">

                    <i class="fa-slab-press fa-regular fa-circle-user"></i>

                </div>


                <!-- PROFILE NAME -->

                <h2
                    id="customer-name">

                    Customer Name

                </h2>


                <!-- PROFILE ROLE -->

                <p
                    class="profile-role">

                    Customer

                </p>


                <!-- PROFILE DETAILS -->

                <div
                    class="profile-details">


                    <div
                        class="profile-info">

                        <i
                            class="fa-solid fa-user">
                        </i>


                        <div>

                            <small>
                                Full Name
                            </small>


                            <p
                                id="profile-name">

                                Customer Name

                            </p>

                        </div>

                    </div>


                    <div
                        class="profile-info">

                        <i
                            class="fa-solid fa-envelope">
                        </i>


                        <div>

                            <small>
                                Email
                            </small>


                            <p
                                id="profile-email">

                                customer@email.com

                            </p>

                        </div>

                    </div>


                    <div
                        class="profile-info">

                        <i
                            class="fa-solid fa-id-card">
                        </i>


                        <div>

                            <small>
                                Customer ID
                            </small>


                            <p
                                id="profile-id">

                                ID

                            </p>

                        </div>

                    </div>


                </div>


                <!-- PROFILE BUTTONS -->

                <div class="profile-buttons">

    <a href="edit_profile.html" class="btn">
        <i class="fa-solid fa-pen-to-square"></i>
        Edit Profile
    </a>

    <a href="orders.html" class="btn">
        <i class="fa-solid fa-bag-shopping"></i>
        My Orders
    </a>

</div>


            </div>

        </section>

    </main>

</body>

</html>
